[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "pth-corpus"
version = "0.2.0"
description = "Mandarin nasal-pronunciation practice app and local corpus tools."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Internal/local trial use only" }
authors = [{ name = "Mandarin Practice Corpus Team" }]
dependencies = [
  "httpx>=0.27,<1",
  "lxml>=5,<6",
  "numpy>=2,<3",
  "scipy>=1.13,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pypinyin>=0.55.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
]

[project.scripts]
pth-corpus = "pth_corpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pth_corpus", "src/pth_corpus/training"]

[tool.hatch.build.targets.wheel.force-include]
"src/pth_corpus/migrations/001_initial.sql" = "pth_corpus/migrations/001_initial.sql"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
